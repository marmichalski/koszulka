name: "Koszulka"
description: "A GitHub Action that assigns a t-shirt sized label to your pull request based on the size of it"
branding:
  icon: git-merge
  color: orange
inputs:
  token:
    description: "GitHub token to use to interact with the GitHub API."
    required: true
  name:
    description: "The name of the check run."
    required: false
    default: "koszulka"
  ignoreLineDeletions:
    description: "Whether to ignore line deletions."
    required: false
    default: false
  ignoreFileRemovals:
    description: "Whether to ignore complete file removals."
    required: false
    default: false
  ignoreFiles:
    description: "A multi-line list of file names to ignore, matching by minimatch."
    required: false
    default: ""
  labels:
    description: "A multi-line list of labels."
    required: false
    default: |
      size/xs
      size/s
      size/m
      size/l
      size/xl
  labelsSizes:
    description: "A multi-line list of max changes (additions + deletions) per label. The number of sizes must be one less than the number of labels. When the last size is exceeded, the last label will be used."
    default: |
      10
      100
      500
      1000
  commentOnLastSize:
    description: "Should a comment be made when pull request is the biggest size. The comment is updated on later runs, and deleted when the pull request is no longer the biggest size."
    required: false
    default: false
  commentContentOnLastSize:
    description: "Comment content when pull request is the biggest size."
    required: false
    default: >
      This PR is quite large. Please make sure it focuses on a single issue, as it may be rejected because of its size.
  failOnLastSize:
    description: "Should the check run be failed when pull request is the biggest size."
    required: false
    default: false
outputs:
  label:
    description: "The size label assigned to the pull request."
  additions:
    description: "The number of added lines that were counted."
  deletions:
    description: "The number of deleted lines that were counted. It is 0 when ignoreLineDeletions is true."
  total:
    description: "The number of changes (additions + deletions) used to select the label."
  isLastSize:
    description: 'Whether the pull request is the biggest size, as a string "true" or "false".'
runs:
  using: node24
  main: dist/index.js
