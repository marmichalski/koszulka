name: Koszulka

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  koszulka:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false

      - name: Koszulka
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
